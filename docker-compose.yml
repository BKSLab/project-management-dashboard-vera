services:

  # Redis хранит только presence/typing и координирует fan-out; история — в PostgreSQL.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    networks:
      - dashboard_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── База данных ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: project_dashboard_db
    env_file: ./backend/.env
    restart: always
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    networks:
      - dashboard_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Векторная база: отдельная collection на каждый проект ────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: project_dashboard_qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - dashboard_network

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: project_dashboard_backend
    env_file: ./backend/.env
    environment:
      CHAT_REDIS_URL: redis://redis:6379/0
    restart: always
    command: bash entrypoint.sh
    volumes:
      - ./data/uploads:/app/uploads
    networks:
      - dashboard_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Опциональный отдельный MCP. Существующий /mcp в backend сохраняется.
  mcp:
    profiles: ["mcp"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8021
      CHAT_REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "src.mcp_server.worker"]
    restart: unless-stopped
    volumes:
      - ./data/uploads:/app/uploads
    ports:
      - "127.0.0.1:8021:8021"
    networks:
      - dashboard_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8021/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend (Vite SPA, собранная статика отдаётся nginx внутри образа) ────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: project_dashboard_frontend
    restart: unless-stopped
    networks:
      - dashboard_network
    depends_on:
      - backend

  # ── Nginx — единая точка входа (статика + проксирование /api) ─────────────
  nginx:
    image: nginx:alpine
    container_name: project_dashboard_nginx
    ports:
      - "5173:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - dashboard_network
    depends_on:
      - backend
      - frontend

volumes:
  pg_data:
  qdrant_data:

networks:
  dashboard_network:
    driver: bridge
