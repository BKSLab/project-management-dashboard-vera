server {
    listen 80;

    # 10 МБ полезного содержимого файла + небольшой multipart overhead.
    client_max_body_size 11m;

    # Вложения передаются потоком, без временных файлов proxy/client_temp.
    location ~ ^/api/v1/kanban/tasks/[0-9]+/attachments(?:/[0-9]+/content)?$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP: транспорт Streamable HTTP держит долгие соединения и отдаёт
    # поток событий, поэтому буферизация ответа выключена, а таймаут чтения
    # поднят. Без отдельного location путь ушёл бы на фронтенд как SPA-маршрут.
    # Точное совпадение без завершающего слэша: смонтированное приложение
    # ответило бы 307 на /mcp/, а клиент MCP не обязан следовать редиректу
    # на POST. Нормализуем путь здесь, на шлюзе.
    location = /mcp {
        proxy_pass http://backend:8000/mcp/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        proxy_pass http://backend:8000/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
