[loggers]
keys=root,src

[handlers]
keys=consoleHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=WARNING
handlers=consoleHandler

[logger_src]
level=INFO
handlers=consoleHandler
qualname=src
propagate=0

[handler_consoleHandler]
class=src.core.logging_handlers.Utf8ConsoleHandler
level=INFO
formatter=simpleFormatter
args=()

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(funcName)s - %(message)s
