<!DOCTYPE html>
<html lang="ru">
<head>
<title>Агент Вера — ИСР (диаграмма)</title>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    :root {
        --bg: #0A0A0A;
        --fg: #F0F0F0;
        --accent: #F5B800;
        --surface: #1A1A1A;
        --border: #2D2D2D;
        --muted: #999999;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        padding: 56px 24px;
    }
    .vera-page { max-width: 1400px; margin: 0 auto; }
    .vera-header {
        border-bottom: 2px solid var(--accent);
        padding-bottom: 28px;
        margin-bottom: 32px;
    }
    .logo-platform-wrap {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;
        padding: 8px 12px;
        margin-bottom: 24px;
    }
    .logo-platform-img-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        outline: 1px solid rgba(245,184,0,0.45);
        box-shadow: 0 0 16px rgba(245,184,0,0.28);
    }
    .logo-platform-img { width: 32px; height: 32px; border-radius: 50%; display: block; }
    .logo-platform-name {
        font-size: 14px;
        font-weight: 700;
        color: var(--accent);
        text-shadow: 0 0 8px rgba(245,184,0,0.4);
    }
    .logo-platform-braille {
        font-size: 9px;
        letter-spacing: 0.15em;
        color: rgba(245,184,0,0.8);
    }
    .vera-tag {
        display: block;
        font-size: 26px;
        font-weight: 700;
        color: var(--fg);
        margin-bottom: 12px;
    }
    .vera-title-row { display: flex; align-items: center; gap: 18px; margin-bottom: 8px; }
    .vera-logo-img {
        height: 60px;
        width: 60px;
        border-radius: 50%;
        border: 2px solid rgba(245, 184, 0, 0.35);
        flex-shrink: 0;
    }
    .vera-h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
    .vera-h1 span { color: var(--accent); }
    .vera-subtitle { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .diagram-frame {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        overflow: hidden;
        height: 78vh;
        width: 100%;
        position: relative;
    }
    .diagram-frame .mxgraph,
    .diagram-frame .mxgraph > div,
    .diagram-frame svg {
        max-width: none !important;
        height: 100% !important;
    }
    .vera-footer {
        border-top: 1px solid var(--border);
        padding-top: 20px;
        margin-top: 32px;
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: var(--muted);
    }
</style>
</head>
